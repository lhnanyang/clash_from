ruleset=🐟 漏网之鱼,[]FINAL


;========================================================
; 2、业务策略组

;========================================================



custom_proxy_group=🎯 全球直连`select`[]DIRECT`[http://wifi.vivo.com.cn/generate_204](http://wifi.vivo.com.cn/generate_204)

custom_proxy_group=🐟 漏网之鱼`fallback`[]香港`[]所有-自动`[]DIRECT`http://www.gstatic.com/generate_204`300,5,100

custom_proxy_group=🔀 非标端口`select`[]DIRECT`[]🐟 漏网之鱼`[]所有-自动`[]所有-手动


;========================================================
; 3、所有节点组
;========================================================

; 所有-手动
; 所有节点，完全手动选择

custom_proxy_group=所有-手动`select`.*

; 所有-自动
; 所有节点自动测速

custom_proxy_group=所有-自动`url-test`.*`http://www.gstatic.com/generate_204`300,,50




;========================================================
; 4、香港
;========================================================

custom_proxy_group=香港-手动`select`(广港|香港|HK|Hong Kong|🇭🇰|HongKong)

custom_proxy_group=香港-自动`url-test`(广港|香港|HK|Hong Kong|🇭🇰|HongKong)`http://www.gstatic.com/generate_204`300,5,100

custom_proxy_group=香港-故障转移`fallback`[]香港-自动`[]台湾-自动`[]日本-自动`[]新加坡-自动`[]美国-自动`[]其他-自动`http://www.gstatic.com/generate_204`300,5,100


; 香港地区入口
custom_proxy_group=香港`select`[]香港-手动`[]香港-自动`[]香港-故障转移


;========================================================
; 12、规则生成器
;========================================================

enable_rule_generator=true

overwrite_original_rules=true
